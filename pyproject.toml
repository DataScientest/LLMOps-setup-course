[project]
name = "llmops-setup-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bcrypt>=3.1.3,<4.0.0",
    "fastapi>=0.116.1",
    "httpx>=0.28.1",
    "litellm==1.75.7",
    "mlflow==3.15.1",
    "openai>=1.97.1",
    "passlib[bcrypt]>=1.7.4",
    "prometheus-client==0.20.0",
    "pydantic>=2.11.7",
    "python-jose[cryptography]>=3.5.0",
    "python-multipart>=0.0.20",
    "python-dotenv>=1.1.1",
    "qdrant-client==1.15.1",
    "requests>=2.32.4",
    "uvicorn>=0.35.0",
]

[dependency-groups]
dev = [
    "black>=25.1.0",
    "flake8>=7.3.0",
    "isort>=6.0.1",
    "mypy>=1.17.1",
    "pdoc>=15.0.4",
    "pytest>=8.4.1",
    "pytest-asyncio>=1.1.0",
    "pytest-cov>=6.2.1",
    "pytest-html>=4.1.1",
    "pytest-mock>=3.14.1",
    "pytest-sugar>=1.0.0",
    "pytest-watcher>=0.4.3",
    "pytest-xdist>=3.8.0",
    "responses>=0.25.8",
    "types-requests>=2.32.4.20250809",
]

[tool.pytest.ini_options]
pythonpath = ["src/api"]
testpaths = ["tests"]
addopts = "-m 'not integration'"
markers = [
    "integration: requires the Docker Compose stack and provider credentials",
]

[tool.black]
target-version = ["py313"]
