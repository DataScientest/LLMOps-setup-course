services:
  # MLflow experiment initialization
  mlflow-init:
    build:
      context: .
      dockerfile: ./src/api/Dockerfile
    environment:
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      mlflow:
        condition: service_healthy
    volumes:
      - ./scripts:/app/scripts
    networks:
      - llmops-network
    command: ["uv", "run", "--no-sync", "python", "/app/scripts/init_mlflow_experiments.py"]
    restart: "no"  # Run once and exit

  # FastAPI application
  api:
    build:
      context: .
      dockerfile: ./src/api/Dockerfile
    ports:
      - "${API_PORT:-8000}:8000"
    environment:
      - LITELLM_URL=http://litellm:8000
      - MLFLOW_TRACKING_URI=http://mlflow:5000
    depends_on:
      litellm:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      mlflow-init:
        condition: service_completed_successfully
    volumes:
      - .:/app
      - ./mlflow-data:/mlflow-data
    working_dir: /app
    networks:
      - llmops-network
    command: ["uv", "run", "--no-sync", "uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # LiteLLM proxy
  litellm:
    build:
      context: .
      dockerfile: ./litellm/Dockerfile
    ports:
      - "${LITELLM_PORT:-8001}:8000"
    environment:
      # API Keys for the different models
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - LITELLM_LOG=${LITELLM_LOG}
      # MLflow configuration for native tracing
      - MLFLOW_TRACKING_URI=http://mlflow:5000
      - MLFLOW_EXPERIMENT_NAME=llmops-litellm-security
    volumes:
    # OR (the one below for information): - ./litellm/litellm-config.yaml:/app/config.yaml
      - ./litellm/litellm-config-security.yaml:/app/config.yaml
    command: ["--config", "/app/config.yaml", "--port", "8000"]
    networks:
      - llmops-network
    depends_on:
      mlflow:
        condition: service_healthy
      mlflow-init:
        condition: service_completed_successfully
    # Health check
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/readiness')"]
      interval: 30s
      timeout: 10s
      retries: 3

  # MLflow for prompt tracing
  mlflow:
    image: ghcr.io/mlflow/mlflow@sha256:9f9276e57cda1593cfa0fe8519145cd49328e119e85951851b9244e82e3769be
    ports:
      - "${MLFLOW_PORT:-5001}:5000"
    volumes:
      - ./mlflow-data:/mlflow-data
    networks:
      - llmops-network
    command: >
      mlflow server 
      --host 0.0.0.0 
      --port 5000 
      --allowed-hosts mlflow:5000,mlflow,localhost,127.0.0.1
      --backend-store-uri sqlite:///mlflow-data/mlflow.db 
      --default-artifact-root file:///mlflow-data/mlartifacts 
      --serve-artifacts
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

networks:
  llmops-network:
    driver: bridge
