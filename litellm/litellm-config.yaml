# LiteLLM Proxy Configuration

model_list:
  # Primary Qwen model through Groq
  - model_name: groq-qwen-primary
    litellm_params:
      model: groq/qwen/qwen3.6-27b
      api_key: os.environ/GROQ_API_KEY
      
  # Backup Groq model with standard Groq provider
  - model_name: groq-gpt-oss-backup
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
      
  # Fallback models
  - model_name: gpt-4o-secondary
    litellm_params:
      model: gpt-4o
      api_key: os.environ/OPENAI_API_KEY
      
  - model_name: gemini-third
    litellm_params:
      model: gemini/gemini-2.0-flash-exp
      api_key: os.environ/GEMINI_API_KEY
      
  - model_name: openrouter-fallback
    litellm_params:
      model: openrouter/mistralai/mistral-7b-instruct:free
      api_key: os.environ/OPENROUTER_API_KEY

# Configure fallbacks at the router level
router_settings:
  fallbacks:
    - "groq-qwen-primary": ["groq-gpt-oss-backup"]

litellm_settings:
  callbacks: ["mlflow"]
  log_level: INFO

callback_settings:
  mlflow:
    experiment_name: "llmops-new"
