# LiteLLM Proxy Configuration

model_list:
  # Primary model through Groq. Aliases are model-agnostic: when Groq
  # retires a model, only the "model:" line changes. Use Groq production
  # models, not preview ones (https://console.groq.com/docs/models).
  - model_name: groq-primary
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      # gpt-oss models reason first; reasoning tokens count in max_tokens.
      reasoning_effort: low
      # LiteLLM 1.75 does not list reasoning_effort for groq: allow it explicitly,
      # otherwise every call fails with UnsupportedParamsError (HTTP 400).
      allowed_openai_params: ["reasoning_effort"]
      
  # Backup Groq model with standard Groq provider
  - model_name: groq-backup
    litellm_params:
      model: groq/openai/gpt-oss-20b
      api_key: os.environ/GROQ_API_KEY
      reasoning_effort: low
      # LiteLLM 1.75 does not list reasoning_effort for groq: allow it explicitly,
      # otherwise every call fails with UnsupportedParamsError (HTTP 400).
      allowed_openai_params: ["reasoning_effort"]
      
  # Fallback models
  - model_name: gpt-4o-secondary
    litellm_params:
      model: gpt-4o
      api_key: os.environ/OPENAI_API_KEY
      
  - model_name: gemini-third
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
      
  - model_name: openrouter-fallback
    litellm_params:
      model: openrouter/mistralai/mistral-7b-instruct:free
      api_key: os.environ/OPENROUTER_API_KEY

# Configure fallbacks at the router level
router_settings:
  fallbacks:
    - "groq-primary": ["groq-backup"]

litellm_settings:
  callbacks: ["mlflow"]
  log_level: INFO

callback_settings:
  mlflow:
    experiment_name: "llmops-new"
